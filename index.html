<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcoursup — tri de cartes</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="bar">
  <nav id="breadcrumb" class="breadcrumb" aria-label="Chemin"></nav>
  <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Réglages" aria-expanded="false">⚙</button>
</header>

<section id="settings" class="settings" hidden>
  <p class="settings-hint">Glisse les niveaux pour les ordonner, désactive ceux dont tu ne veux pas.</p>
  <ol id="levels" class="deck"></ol>
  <button id="settings-apply" type="button" class="apply">Appliquer</button>
</section>

<div id="status" class="status" hidden></div>
<ol id="deck" class="deck"></ol>
<div id="deck-more" class="more" hidden><button id="load-more" type="button">Charger la suite</button></div>

<script src="assets/app.js"></script>
</body>
</html>
